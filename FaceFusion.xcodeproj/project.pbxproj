		AA00000000000000000040 /* Patch onnxruntime MinimumOSVersion */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Patch onnxruntime MinimumOSVersion";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# The onnxruntime.framework from the ONNX Runtime SPM package declares\n# MinimumOSVersion 15.1 in its Info.plist while its binary is linked for 17.0.\n# App Store validation rejects that contradiction with ITMS-90208, so bring the\n# plist in line with the deployment target. Editing an Info.plist invalidates\n# the framework's signature, so it has to be signed again afterwards.\nset -e\nFW=\"$CODESIGNING_FOLDER_PATH/Frameworks/onnxruntime.framework\"\n[ -d \"$FW\" ] || exit 0\nCURRENT=$(/usr/libexec/PlistBuddy -c \"Print :MinimumOSVersion\" \"$FW/Info.plist\" 2>/dev/null || echo \"\")\n[ \"$CURRENT\" = \"$IPHONEOS_DEPLOYMENT_TARGET\" ] && exit 0\n/usr/libexec/PlistBuddy -c \"Set :MinimumOSVersion $IPHONEOS_DEPLOYMENT_TARGET\" \"$FW/Info.plist\"\necho \"note: onnxruntime.framework MinimumOSVersion $CURRENT -> $IPHONEOS_DEPLOYMENT_TARGET\"\nif [ \"$CODE_SIGNING_ALLOWED\" = \"YES\" ] && [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ]; then\n  codesign --force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" --preserve-metadata=identifier,entitlements,flags \"$FW\"\nfi\n";
		};
/* End PBXShellScriptBuildPhase section */

